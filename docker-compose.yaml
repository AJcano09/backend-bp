services:
  # Microservicio 1: Cliente/Persona (Contiene Domain, App, Infra internamente)
  clientservice.api:
    image: clientservice.api
    container_name: bank_client_api
    build:
      context: .
      dockerfile: src/Services/ClientService/ClientService.Api/Dockerfile
    ports:
      - "5001:8080"
    env_file:
      - ./src/Services/ClientService/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Microservicio 2: Cuenta/Movimientos (Contiene Domain, App, Infra internamente)
  accountservice.api:
    image: accountservice.api
    container_name: bank_account_api
    build:
      context: .
      dockerfile: src/Services/AccountService/AccountService.Api/Dockerfile
    ports:
      - "5002:8080"
    env_file:
      - ./src/Services/AccountService/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Una instancia de PostgreSQL, DOS bases (database-per-service).
  # bank_clients se crea con POSTGRES_DB; bank_accounts la crea el EF Core
  # de AccountService al arrancar (Database.Migrate(), usuario superuser).
  postgres-db:
    image: postgres:15-alpine
    container_name: bank_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CLIENTS}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_CLIENTS}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Message Broker: comunicación asíncrona ClientService -> AccountService
  # (ClientService publica eventos de cliente; AccountService mantiene su
  # read model ClientesLectura para el reporte F4). Las credenciales se
  # inyectan desde el .env raíz (gitignorado); nunca hardcodear aquí.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bank_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data: