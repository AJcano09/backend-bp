version: '3.8'

services:
  # Microservicio 1: Cliente/Persona (Contiene Domain, App, Infra internamente)
  clientservice.api:
    image: clientservice.api
    container_name: bank_client_api
    build:
      context: .
      dockerfile: src/Services/ClientService/ClientService.Api/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=bank_db;Username=admin;Password=adminpassword
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres-db
      - rabbitmq
    restart: unless-stopped

  # Microservicio 2: Cuenta/Movimientos (Contiene Domain, App, Infra internamente)
  accountservice.api:
    image: accountservice.api
    container_name: bank_account_api
    build:
      context: .
      dockerfile: src/Services/AccountService/AccountService.Api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=bank_db;Username=admin;Password=adminpassword
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres-db
      - rabbitmq
    restart: unless-stopped

  # Base de datos compartida (PostgreSQL)
  postgres-db:
    image: postgres:15-alpine
    container_name: bank_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: bank_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bank_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

volumes:
  postgres_data: